[project]
name = "lookout"
version = "0.1.0"
description = "Self-hosted homelab security monitor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.122.0",
    "apscheduler>=3.11.3,<4.0",
    "docker>=7.2.0",
    "openai>=2.46.0",
    "pydantic-settings>=2.15.0",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lookout"]

[project.scripts]
lookout = "lookout.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
python_version = "3.14"

[[tool.mypy.overrides]]
module = ["apscheduler.*", "watchdog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "types-docker>=7.2.0.20260813",
]
