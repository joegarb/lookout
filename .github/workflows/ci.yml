name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy lookout/

      - name: Tests
        run: uv run pytest

      - name: Docker build
        run: docker build .

  # Publish PR images only for things worth hand-testing. Skip anything that
  # auto-merges untested: Dependabot patch/minor for any ecosystem, plus every
  # GitHub Actions update (majors included). Keep other-ecosystem majors and
  # human PRs.
  pr-image-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - id: meta
        if: github.actor == 'dependabot[bot]'
        uses: dependabot/fetch-metadata@v3
      - id: decide
        run: |
          t="${{ steps.meta.outputs.update-type }}"
          e="${{ steps.meta.outputs.package-ecosystem }}"
          if [ "$t" = "version-update:semver-patch" ] || [ "$t" = "version-update:semver-minor" ] || [ "$e" = "github_actions" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  publish-pr:
    if: github.event_name == 'pull_request' && needs.pr-image-check.outputs.publish == 'true'
    needs: [ci, pr-image-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ghcr.io/joegarb/lookout:pr-${{ github.event.pull_request.number }}
